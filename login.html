<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Institution Portal</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="deco-element deco1"></div>
  <div class="deco-element deco2"></div>
  <div class="deco-element deco3"></div>
  <div class="deco-element deco4"></div>

  <div class="logo">
    <h2>Giga Nigga</h2>
  </div>

  <div class="main-container">
    <div class="login-card">
      <div class="welcome-text">
        <h1>Login</h1>
        <span class="role-badge" id="roleBadge">Loading...</span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email or Username</label>
          <input type="text" class="form-input" placeholder="Enter your email or username" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" placeholder="Enter your password" required>
        </div>

        <div class="forgot-password">
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login">Login</button>
      </form>

      <div class="back-link">
        <a href="index.html">← Back to Home</a>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
