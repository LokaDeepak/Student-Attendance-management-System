<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mark Attendance">
    <title>Mark Attendance - SAMS</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-secondary">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">S</div>
            <div class="sidebar-brand">SAMS</div>
        </div>

        <nav class="sidebar-nav">
            <a href="/admindashboard" class="nav-item">
                <span class="nav-icon"><i class="ph ph-squares-four"></i></span>
                <span>Dashboard</span>
            </a>
            
            <div class="nav-section">
                <div class="nav-section-title">Teaching</div>
                <div class="nav-item">
                    <span class="nav-icon"><i class="ph ph-books"></i></span>
                    <span>My Subjects</span>
                </div>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Attendance</div>
                <a href="#today" class="nav-item active">
                    <span class="nav-icon"><i class="ph ph-calendar-check"></i></span>
                    <span>Mark Attendance</span>
                </a>
                <a href="/viewreport" class="nav-item">
                    <span class="nav-icon"><i class="ph ph-chart-line-up"></i></span>
                    <span>View Reports</span>
                </a>
            </div>
        </nav>

        <div class="sidebar-footer">
            <a href="/login" class="nav-item danger">
                <span class="nav-icon"><i class="ph ph-sign-out"></i></span>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle btn-icon">
                    <span>☰</span>
                </button>
                <h1 class="topbar-title">Mark Attendance</h1>
            </div>

            <div class="topbar-right">
                <button class="btn btn-icon btn-ghost" data-theme-toggle>
                    <i class="ph ph-moon text-xl icon-dark"></i>
                    <i class="ph ph-sun text-xl icon-light" style="display: none;"></i>
                </button>
                <div class="avatar"><span class="text-xs">AD</span></div>
            </div>
        </header>

        <!-- Content -->
        <div class="animate animate-fade-in-up">
            
            <!-- Class Selection (Simulated Step 1) -->
            <div class="card mb-6">
                <div class="card-body">
                    <form id="attendance-config" class="flex flex-wrap items-end gap-4">
                        <div class="form-group flex-1 min-w-[200px]">
                            <label class="form-label">Select Class</label>
                            <select class="form-select">
                                <option>CS-A (Year 2)</option>
                                <option>IT-B (Year 1)</option>
                            </select>
                        </div>
                        
                        <div class="form-group flex-1 min-w-[200px]">
                            <label class="form-label">Subject</label>
                            <select class="form-select">
                                <option>Mathematics</option>
                                <option>Physics</option>
                            </select>
                        </div>

                        <div class="form-group flex-1 min-w-[200px]">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-input" value="2024-12-28">
                        </div>
                    </form>
                </div>
            </div>

            <!-- Attendance List -->
            <form action="/attendance" method="POST">
                <div class="card">
                    <div class="sticky-action-bar flex justify-between items-center">
                    <div class="text-sm text-muted">
                        <span id="present-count" class="font-bold text-success">35</span> Present, 
                        <span id="absent-count" class="font-bold text-error">0</span> Absent
                    </div>
                    <div class="flex gap-2">
                        <button type="button" class="btn btn-ghost" onclick="resetAttendance()">Reset</button>
                        <button type="submit" class="btn btn-primary">
                            <span>Submit Attendance</span>
                            <i class="ph ph-check"></i>
                        </button>
                    </div>
                </div>
                    
                    <div class="card-body p-0">
                        <div class="overflow-x-auto">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th class="w-16">#</th>
                                        <th>Student Name</th>
                                        <th>Reg No</th>
                                        <th class="text-center">Status</th>
                                        <th>Remarks</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Student 1 -->
                                    <tr class="attendance-row">
                                        <td>1</td>
                                        <td class="font-medium">Sarah Jones</td>
                                        <td class="text-muted text-sm">2024001</td>
                                        <td class="text-center">
                                            <div class="flex justify-center gap-2">
                                                <label class="radio-card p-1 cursor-pointer">
                                                    <input type="radio" name="status_1" value="present" checked class="hidden peer">
                                                    <div class="w-8 h-8 rounded-full bg-surface border border-border peer-checked:bg-success peer-checked:text-white flex items-center justify-center transition-colors">
                                                        P
                                                    </div>
                                                </label>
                                                <label class="radio-card p-1 cursor-pointer">
                                                    <input type="radio" name="status_1" value="absent" class="hidden peer">
                                                    <div class="w-8 h-8 rounded-full bg-surface border border-border peer-checked:bg-error peer-checked:text-white flex items-center justify-center transition-colors">
                                                        A
                                                    </div>
                                                </label>
                                            </div>
                                        </td>
                                        <td>
                                            <input type="text" class="form-input py-1 text-sm" placeholder="Optional remark">
                                        </td>
                                    </tr>
                                    
                                    <!-- Student 2 -->
                                    <tr class="attendance-row">
                                        <td>2</td>
                                        <td class="font-medium">Mike Ross</td>
                                        <td class="text-muted text-sm">2024002</td>
                                        <td class="text-center">
                                            <div class="flex justify-center gap-2">
                                                <label class="radio-card p-1 cursor-pointer">
                                                    <input type="radio" name="status_2" value="present" checked class="hidden peer">
                                                    <div class="w-8 h-8 rounded-full bg-surface border border-border peer-checked:bg-success peer-checked:text-white flex items-center justify-center transition-colors">
                                                        P
                                                    </div>
                                                </label>
                                                <label class="radio-card p-1 cursor-pointer">
                                                    <input type="radio" name="status_2" value="absent" class="hidden peer">
                                                    <div class="w-8 h-8 rounded-full bg-surface border border-border peer-checked:bg-error peer-checked:text-white flex items-center justify-center transition-colors">
                                                        A
                                                    </div>
                                                </label>
                                            </div>
                                        </td>
                                        <td>
                                            <input type="text" class="form-input py-1 text-sm" placeholder="Optional remark">
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="sticky bottom-6 mt-6 flex justify-end">
                    <button type="submit" class="btn btn-primary btn-lg shadow-lg">Save Attendance Record</button>
                </div>
            </form>

        </div>
    </main>

    <!-- Scripts -->
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/components.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script>
        function markAll(status) {
            const radios = document.querySelectorAll(`input[value="${status}"]`);
            radios.forEach(radio => radio.checked = true);
        }
    </script>
</body>
</html>
