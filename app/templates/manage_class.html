<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage Classes">
    <title>Manage Classes - SAMS</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-secondary">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">S</div>
            <div class="sidebar-brand">SAMS</div>
        </div>

        <nav class="sidebar-nav">
            <a href="/masterdashboard" class="nav-item">
                <span class="nav-icon"><i class="ph ph-squares-four"></i></span>
                <span>Dashboard</span>
            </a>
            
            <div class="nav-section">
                <div class="nav-section-title">Management</div>
                <a href="/addadmins" class="nav-item">
                    <span class="nav-icon"><i class="ph ph-user-gear"></i></span>
                    <span>Admins</span>
                </a>
                <a href="/addclass" class="nav-item active">
                    <span class="nav-icon"><i class="ph ph-chalkboard-teacher"></i></span>
                    <span>Classes</span>
                </a>
                <a href="/addstudent" class="nav-item">
                    <span class="nav-icon"><i class="ph ph-student"></i></span>
                    <span>Students</span>
                </a>
                <a href="/assignsubject" class="nav-item">
                    <span class="nav-icon"><i class="ph ph-books"></i></span>
                    <span>Subjects</span>
                </a>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Reports</div>
                <a href="/viewreport" class="nav-item" title="Coming Soon">
                    <span class="nav-icon"><i class="ph ph-chart-line-up"></i></span>
                    <span>Reports</span>
                </a>
            </div>
        </nav>

        <div class="sidebar-footer">
            <a href="/login" class="nav-item danger">
                <span class="nav-icon"><i class="ph ph-sign-out"></i></span>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle btn-icon">
                    <span>☰</span>
                </button>
                <h1 class="topbar-title">Manage Classes</h1>
            </div>

            <div class="topbar-right">
                <button class="btn btn-icon btn-ghost" data-theme-toggle>
                    <i class="ph ph-moon text-xl icon-dark"></i>
                    <i class="ph ph-sun text-xl icon-light" style="display: none;"></i>
                </button>
                <div class="avatar"><span class="text-xs">MA</span></div>
            </div>
        </header>

        <!-- Content -->
        <div class="animate animate-fade-in-up">
            
            <div class="grid lg:grid-cols-3 gap-6">
                <!-- Add Class Form -->
                <div class="card col-span-1 h-fit">
                    <div class="card-header">
                        <h3 class="card-title">Add New Class</h3>
                    </div>
                    <div class="card-body">
                        <form action="/addclass" method="POST">
                            <div class="form-group mb-4">
                                <label class="form-label required">Class ID</label>
                                <input type="number" name="class_id" class="form-input" placeholder="ID (e.g., 101)" required>
                            </div>

                            <div class="form-group mb-6">
                                <label class="form-label required">Class Name</label>
                                <input type="text" name="class_name" class="form-input" placeholder="Ex. CS-A" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-full">Create Class</button>
                        </form>
                    </div>
                </div>

                <!-- Class List -->
                <div class="card lg:col-span-2">
                    <div class="card-header">
                        <h3 class="card-title">Existing Classes</h3>
                    </div>
                    <div class="card-body p-0">
                        <div class="overflow-x-auto">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Class ID</th>
                                        <th>Class Name</th>
                                        <th>Students</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>1</td>
                                        <td>101</td>
                                        <td class="font-medium">Computer Science - A</td>
                                        <td>45</td>
                                        <td>
                                            <form action="/removeclass/101" method="POST" class="inline-block">
                                                <input type="hidden" name="class_id" value="101">
                                                <button type="submit" class="btn btn-xs btn-ghost text-error" title="Remove">
                                                    <i class="ph ph-trash"></i>
                                                </button>
                                            </form>
                                            <button class="btn btn-xs btn-ghost" title="Edit">
                                                <i class="ph ph-pencil-simple"></i>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>2</td>
                                        <td>102</td>
                                        <td class="font-medium">Information Tech B</td>
                                        <td><span class="badge badge-info">38 Students</span></td>
                                        <td>
                                            <button class="btn btn-icon btn-sm btn-ghost text-error" title="Remove Class">
                                                🗑️
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/components.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
